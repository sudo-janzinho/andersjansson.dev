<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakt | Anders Jansson</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", SegoeUI, Roboto, Helvetica, Arial, sans-serif;
         color: #e6edf3; line-height: 1.6; min-height: 100vh;
         background: radial-gradient(circle at 20% 20%, #0f2027, #203a43, #2c5364); }
  .wrap { max-width: 620px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
  h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: .5rem; }
  .sub { color: #a8c0cc; margin-bottom: 2rem; }
  form { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
         border-radius: 12px; padding: 1.8rem; }
  label { display: block; font-size: .9rem; font-weight: 600; margin-bottom: .35rem; color: #c6d6e2; }
  input, textarea { width: 100%; padding: .7rem .9rem; border-radius: 8px; border: 1px solid rgba(255,255,255,.2);
         background: rgba(0,0,0,.25); color: #e6edf3; font-size: 1rem; margin-bottom: 1.2rem; font-family: inherit; }
  input:focus, textarea:focus { outline: none; border-color: #61dafb; }
  textarea { min-height: 140px; resize: vertical; }
  button { padding: .8rem 1.8rem; border: 2px solid #61dafb; border-radius: 999px; background: transparent;
         color: #61dafb; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background .25s, color .25s; }
  button:hover { background: #61dafb; color: #0f2027; }
  .back { display: inline-block; margin-top: 1.5rem; color: #9fb7c6; text-decoration: none; }
  .back:hover { color: #61dafb; }
  #formstatus { margin-top: 1rem; font-size: .95rem; color: #61dafb; min-height: 1.4em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kontakt</h1>
  <p class="sub">Send meg en melding – jeg svarer så fort jeg kan.</p>
  <form id="kontakt-form" action="https://formspree.io/f/mwlejaey" method="POST">
    <label for="name">Navn</label>
    <input id="name" name="name" type="text" required>
    <label for="email">E-post</label>
    <input id="email" name="email" type="email" required>
    <label for="message">Melding</label>
    <textarea id="message" name="message" required></textarea>
    <button type="submit">Send melding</button>
    <div id="formstatus"></div>
  </form>
  <a class="back" href="index.html">&larr; Tilbake til forsiden</a>
</div>
<script>
// Skicka via fetch så besökaren stannar kvar på sidan
const form = document.getElementById('kontakt-form');
const status = document.getElementById('formstatus');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  status.textContent = 'Sender…';
  try {
    const res = await fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    });
    if (res.ok) {
      status.textContent = 'Takk! Meldingen din er sendt.';
      form.reset();
    } else {
      status.textContent = 'Noe gikk galt – prøv igjen eller send e-post til meg@andersjansson.dev';
    }
  } catch {
    status.textContent = 'Nettverksfeil – prøv igjen senere.';
  }
});
</script>
</body>
</html>
